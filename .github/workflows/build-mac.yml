name: Build Mac app

# Gera "Organizar Cenas.app" (universal: Apple Silicon + Intel).
# A cada push na main: gera o .zip e publica em Releases com a versão do arquivo VERSION
# (ex.: VERSION = 1.0 → release v1.0). Para lançar versão nova, mude o VERSION.
# Push na mesma versão substitui o .zip daquela release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PY_VERSION: "3.12.8"
  APP_NAME: "Organizar Cenas"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Python oficial do python.org: é "universal2" e traz Tk 8.6.
      # (O Python do setup-python é só arm64 e não geraria app para Intel.)
      - name: Instalar Python universal2 (python.org)
        run: |
          curl -fsSLo python.pkg "https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -c "import sys, tkinter; print(sys.version, 'Tk', tkinter.TkVersion)"
          lipo -archs "$PY"

      - name: Testes
        run: $PY testes_cenas.py

      - name: Gerar o .app
        run: |
          $PY -m pip install --upgrade pip pyinstaller==6.11.1
          $PY -m PyInstaller --noconfirm --windowed --target-arch universal2 \
            --name "$APP_NAME" --osx-bundle-identifier br.cineoitoum.organizarcenas \
            organizar_cenas.py
          echo "Arquiteturas do executável:"
          lipo -archs "dist/$APP_NAME.app/Contents/MacOS/$APP_NAME"

      - name: Montar o .zip (app + LEIA-ME)
        run: |
          mkdir -p pacote
          cp -R "dist/$APP_NAME.app" pacote/
          cp README.md "pacote/LEIA-ME.md"
          cd pacote && ditto -c -k --sequesterRsrc . "../Organizar-Cenas-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Organizar-Cenas-mac
          path: Organizar-Cenas-mac.zip

      - name: Ler versão
        id: versao
        run: echo "v=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publicar na página de Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.v }}
          name: Organizar Cenas v${{ steps.versao.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Organizar-Cenas-mac.zip
          body: |
            Baixe **Organizar-Cenas-mac.zip** abaixo, descompacte e arraste o app para Aplicativos.
            Funciona em Mac Apple Silicon e Intel. Na primeira vez, veja o LEIA-ME dentro do .zip
            para liberar o app (ele não é assinado pela Apple).
